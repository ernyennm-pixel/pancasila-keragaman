<script>
const Q=[

['s','p','Tetanggamu merayakan hari raya agama yang berbeda denganmu. Sikap yang tepat adalah ....',['Menghormati dan tidak mengganggu perayaan mereka','Menyalakan musik keras','Melarang mereka merayakan','Menjauh dan tidak mau bergaul'],[0],'Menghormati perayaan agama lain adalah wujud toleransi.'],
['s','p','Pohon beringin pada lambang Pancasila melambangkan sila ke ....',['Tiga','Satu','Empat','Lima'],[0],'Pohon beringin melambangkan sila ketiga, Persatuan Indonesia.'],

['s','c','Pilih SEMUA perilaku yang mencerminkan semangat Bhinneka Tunggal Ika!',['Kerja bakti bersama warga berbeda suku','Menghargai pendapat teman','Hanya berteman dengan satu suku','Bermain bersama tanpa membedakan agama'],[0,1,3],'Bekerja sama dan menghargai tanpa membedakan suku atau agama mencerminkan Bhinneka Tunggal Ika.'],
['s','b','Tentukan Benar atau Salah setiap pernyataan!',['Semua suku bangsa di Indonesia memiliki adat istiadat yang sama.','Perbedaan budaya adalah kekayaan bangsa.','Bahasa daerah perlu dilestarikan.'],[1,2],'Tiap suku memiliki adat berbeda; perbedaan itu kekayaan, dan bahasa daerah harus dijaga.'],
['s','b','Tentukan Benar atau Salah setiap pernyataan!',['Toleransi berarti memaksa teman mengikuti agama kita.','Memberi teman kesempatan beribadah termasuk toleransi.','Gotong royong hanya boleh dilakukan sesama agama.'],[1],'Toleransi adalah menghargai, bukan memaksa. Gotong royong terbuka untuk semua warga.'],
['k','p','Semboyan Bhinneka Tunggal Ika diambil dari kitab Sutasoma karya ....',['Mpu Tantular','Mpu Prapanca','Gajah Mada','Ki Hajar Dewantara'],[0],'Kitab Sutasoma ditulis oleh Mpu Tantular pada masa Majapahit.'],
['k','p','Dua kelompok warga berselisih karena perbedaan adat. Cara penyelesaian yang paling sesuai dengan Pancasila adalah ....',['Musyawarah untuk mencapai mufakat','Memihak kelompok yang lebih besar','Saling mengejek di media sosial','Menghindar dan membiarkan konflik'],[0],'Musyawarah mufakat sesuai sila keempat dan menyelesaikan masalah tanpa kekerasan.'],
['k','p','Kerja bakti desa dijadwalkan bertepatan dengan hari raya salah satu agama warga. Tindakan paling tepat adalah ....',['Bermusyawarah dan menyesuaikan jadwal agar semua bisa ikut','Tetap melaksanakan tanpa memberi tahu','Mengecualikan warga yang merayakan','Membatalkan kerja bakti selamanya'],[0],'Musyawarah dan penyesuaian jadwal menghormati ibadah semua warga.'],
['k','p','Sila Pancasila yang paling berkaitan langsung dengan sikap saling menghormati antarumat beragama adalah ....',['Ketuhanan Yang Maha Esa','Kemanusiaan yang Adil dan Beradab','Kerakyatan yang Dipimpin oleh Hikmat Kebijaksanaan','Keadilan Sosial bagi Seluruh Rakyat Indonesia'],[0],'Sila pertama mendasari kebebasan beragama dan sikap saling menghormati antarumat beragama.'],
['k','c','Pilih SEMUA manfaat keragaman budaya bagi bangsa Indonesia!',['Menjadi daya tarik wisata','Memperkaya seni dan tradisi','Pasti menyebabkan perpecahan','Menumbuhkan sikap saling menghargai'],[0,1,3],'Keragaman memberi manfaat bila disikapi dengan persatuan; perpecahan bukan akibat pasti.'],
['k','c','Pilih SEMUA upaya melestarikan budaya daerah!',['Belajar tarian daerah','Mengikuti festival budaya','Menganggap budaya asing selalu lebih baik','Menggunakan bahasa daerah di lingkungan yang sesuai'],[0,1,3],'Melestarikan berarti mempelajari, menampilkan, dan menggunakan budaya sendiri.'],
['k','c','Pilih SEMUA perilaku yang melanggar sikap toleransi!',['Mengejek cara ibadah teman','Mengucapkan terima kasih saat dibantu teman','Memaksa teman mengikuti ritual agama kita','Mengganggu orang yang sedang beribadah'],[0,2,3],'Mengejek, memaksa, dan mengganggu ibadah adalah perilaku tidak toleran.'],
['k','c','Pilih SEMUA faktor penyebab keragaman suku bangsa di Indonesia!',['Wilayah berupa kepulauan','Pengaruh budaya luar melalui perdagangan','Adanya aturan satu budaya untuk semua daerah','Kondisi alam yang berbeda di tiap daerah'],[0,1,3],'Geografi, pengaruh luar, dan kondisi alam membentuk keragaman; tidak ada aturan satu budaya.'],
['k','c','Pilih SEMUA contoh kerukunan umat beragama!',['Warga lintas agama ikut menjaga keamanan saat hari raya','Warga menolak bergaul dengan pemeluk agama lain','Warga bermusyawarah sebelum membangun rumah ibadah','Warga saling berkunjung saat hari raya'],[0,2,3],'Kerukunan terlihat dari saling menjaga, bermusyawarah, dan bersilaturahmi.'],
['k','b','Tentukan Benar atau Salah setiap pernyataan!',['Bhinneka Tunggal Ika berarti semua budaya harus disatukan menjadi satu budaya.','Perbedaan budaya dapat hidup berdampingan dalam persatuan.','Semboyan Bhinneka Tunggal Ika tertulis pada lambang Garuda Pancasila.'],[1,2],'Bhinneka Tunggal Ika menghargai perbedaan, bukan menyeragamkan.'],
['k','b','Tentukan Benar atau Salah setiap pernyataan!',['Pasal 29 UUD 1945 menjamin kemerdekaan penduduk memeluk agama.','Negara memaksa warga memeluk agama tertentu.','Kebebasan beribadah harus tetap menghormati hak orang lain.'],[0,2],'Negara menjamin kebebasan beragama dan tidak memaksa.'],
['k','b','Tentukan Benar atau Salah setiap pernyataan!',['Bahasa daerah dapat punah jika tidak digunakan penuturnya.','Bahasa Indonesia menggantikan seluruh bahasa daerah.','Bahasa Indonesia mempersatukan penutur bahasa daerah yang berbeda.'],[0,2],'Bahasa Indonesia mempersatukan, bukan menggantikan bahasa daerah.'],
['k','b','Tentukan Benar atau Salah setiap pernyataan!',['Rumah gadang adalah rumah adat Sumatera Barat.','Tari Pendet berasal dari Papua.','Reog Ponorogo berasal dari Jawa Timur.'],[0,2],'Tari Pendet berasal dari Bali.'],
['k','b','Tentukan Benar atau Salah setiap pernyataan!',['Musyawarah mufakat adalah cara menyelesaikan perbedaan pendapat.','Keputusan boleh dibuat sepihak oleh kelompok terbesar.','Musyawarah mencerminkan nilai sila keempat Pancasila.'],[0,2],'Keputusan bersama diambil lewat musyawarah, bukan sepihak.'],
['k','b','Tentukan Benar atau Salah setiap pernyataan!',['Mengejek logat teman dari daerah lain adalah sikap menghargai.','Bangga memakai pakaian adat daerah mencerminkan cinta budaya.','Sikap toleransi dapat mengurangi risiko konflik sosial.'],[1,2],'Mengejek logat merendahkan teman; bangga budaya dan toleransi menjaga kerukunan.']
].map(([l,t,q,o,a,e])=>({l,t,q,o,a,e}));
const DUR=75*60,LV={m:'Mudah',s:'Sedang',k:'Sulit'},TY={p:'Pilihan Ganda',c:'Pilihan Ganda Kompleks (MCMA) – pilih lebih dari satu',b:'Benar / Salah'};
let db=null,user=null,items=Q,T=false,S={ans:{},ragu:{},i:0},rows=[],tab='proses',tick=null,unsub=null;
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sh(n,seed){let h=1779033703;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),3432918353),h=h<<13|h>>>19;let a=h>>>0;const r=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},x=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const isA=(k,v)=>{v=v??S.ans[k];const it=items[k];return v!=null&&(it.t=='p'?true:it.t=='c'?v.length>0:v.every(x=>x!=null))};
function sc(it,v){const a=it.a;if(v==null)return 0;if(it.t=='p')return v===a[0]?1:0;
 if(it.t=='c'){const w=v.filter(x=>!a.includes(x)).length,c=v.filter(x=>a.includes(x)).length;return w?0:c==a.length?1:c?.5:0}
 return it.o.reduce((s,_,j)=>s+(v[j]!=null&&(v[j]===1)===a.includes(j)?1:0),0)/it.o.length}
(async()=>{try{const c=window.claude;if(c){user=await c.use('user');db=await c.use('db')}}catch(e){}
 T=!!(user&&user.canEdit&&user.canEdit());
 if(db){try{const s=await db.doc('config/soal').get();if(s.exists)items=JSON.parse(s.data().items)}catch(e){}}
 login()})();

function login(){A.innerHTML=`<div class="card c"><div class="m">SD Negeri 1 Malebo</div><h1>Asesmen Sumatif Akhir TP</h1><p><b>Pendidikan Pancasila</b><br>Keragaman Budaya dan Agama di Indonesia<br>Kelas 6 / Fase C • ${items.length} soal • 75 menit</p>
${db?'':'<p class="no m">Mode lokal: hasil tidak terkirim ke guru. Buka lewat link dari guru.</p>'}
<p style="max-width:380px;margin:12px auto"><input type="text" id="nm" placeholder="Tulis nama lengkap" maxlength="40"></p><button class="pri" onclick="toRules()">Masuk</button>
<p><button onclick="guru()">Dashboard Guru</button></p></div>`}
function toRules(){const n=$('#nm').value.trim();if(n.length<3)return alert('Isi nama lengkap (minimal 3 huruf).');
 S.nama=n;S.key=n.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
 A.innerHTML=`<div class="card"><h2>Tata Tertib Ujian</h2><ol><li>Berdoa sebelum mengerjakan.</li><li>Kerjakan soal sendiri dengan jujur, tanpa bertanya atau menyontek.</li><li>Waktu mengerjakan 75 menit; ujian selesai otomatis saat waktu habis.</li><li>Ada tiga jenis soal: pilihan ganda, pilihan ganda kompleks (boleh lebih dari satu jawaban), dan benar/salah.</li><li>Gunakan tombol Sebelumnya dan Selanjutnya atau papan nomor untuk berpindah soal.</li><li>Tandai “Ragu-ragu” bila belum yakin; nomornya berwarna kuning.</li><li>Satu nama hanya boleh dipakai di satu perangkat. Jika dibuka di perangkat lain, perangkat lama otomatis berhenti.</li><li>Jangan menutup halaman sebelum menekan tombol Selesai.</li></ol>
<div class="nav"><button onclick="login()">Kembali</button><button class="pri" onclick="start()">Saya Siap, Mulai</button></div></div>`}
async function start(){S.tok=Math.random().toString(36).slice(2);let d=null;
 try{if(db){const s=await db.doc('hasil/'+S.key).get();if(s.exists)d=s.data()}else d=JSON.parse(localStorage.getItem('cbt_'+S.key))}catch(e){}
 if(d&&d.status=='selesai'){S.ans=JSON.parse(d.ans||'{}');S.res=d;S.done=true;return result()}
 if(d){S.mulai=d.mulai;S.ans=JSON.parse(d.ans||'{}');S.ragu=JSON.parse(d.ragu||'{}')}else{S.mulai=Date.now();S.ans={};S.ragu={}}
 S.ord=sh(items.length,S.key);S.i=0;S.done=false;S.lock=false;await save();
 if(db)unsub=db.doc('hasil/'+S.key).onSnapshot(s=>{if(s.exists&&s.data().tok!==S.tok&&!S.done&&!S.lock){S.lock=true;clearInterval(tick);document.body.insertAdjacentHTML('beforeend','<div class="ov"><div class="card c"><h2 class="no">Peringatan</h2><p>Akun ini dibuka di perangkat lain. Ujian di perangkat ini dihentikan. Jawaban terakhir tersimpan dan dilanjutkan di perangkat baru.</p></div></div>')}});
 exam();tick=setInterval(()=>{const r=DUR-Math.floor((Date.now()-S.mulai)/1000),e=$('#tm');if(e)e.textContent=fmt(r);if(r<=0)finish(true)},1000)}
async function save(){if(S.lock)return;const d={nama:S.nama,mulai:S.mulai,ans:JSON.stringify(S.ans),ragu:JSON.stringify(S.ragu),tok:S.tok,status:S.done?'selesai':'berlangsung',upd:Date.now(),...(S.done?S.res:{})};
 try{if(db)await db.doc('hasil/'+S.key).set(d);else localStorage.setItem('cbt_'+S.key,JSON.stringify(d))}catch(e){}}
const sv=()=>{clearTimeout(S.dt);S.dt=setTimeout(save,1500)};
function board(){return S.ord.map((k,i)=>`<button class="n ${S.ragu[k]?'y':isA(k)?'g':'r'} ${i==S.i?'cur':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function exam(){const k=S.ord[S.i],it=items[k],v=S.ans[k],pm=sh(it.o.length,S.key+k),L='ABCDE';let h=`<div class="card top"><div><b>${esc(S.nama)}</b><br><span class="st" id="stt">Sedang mengerjakan</span></div><div class="c m">Sisa waktu<div class="tm" id="tm">${fmt(DUR-Math.floor((Date.now()-S.mulai)/1000))}</div></div></div>
<div class="card"><div class="tag">Soal ${S.i+1} dari ${items.length} • ${TY[it.t]}</div><h3>${esc(it.q)}</h3>`;
 if(it.t=='b')h+='<div class="sc"><table class="bs"><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr>'+pm.map(j=>`<tr><td>${esc(it.o[j])}</td>${[1,0].map(x=>`<td><input type="radio" name="r${j}" data-j="${j}" data-v="${x}" ${v&&v[j]===x?'checked':''} onchange="pick(this)"></td>`).join('')}</tr>`).join('')+'</table></div>';
 else h+=pm.map((j,n)=>`<label class="op"><input type="${it.t=='p'?'radio':'checkbox'}" name="o" data-j="${j}" ${(it.t=='p'?v===j:v&&v.includes(j))?'checked':''} onchange="pick(this)"><span><b>${L[n]}.</b> ${esc(it.o[j])}</span></label>`).join('');
 h+=`<div class="nav"><button onclick="go(${S.i-1})" ${S.i?'':'disabled'}>◀ Sebelumnya</button><label><input type="checkbox" ${S.ragu[k]?'checked':''} onchange="rg(this)"> Ragu-ragu</label>${S.i<items.length-1?`<button class="pri" onclick="go(${S.i+1})">Selanjutnya ▶</button>`:'<button class="pri" onclick="finish()">Selesai</button>'}</div></div>
<div class="card"><b>Papan Nomor Soal</b><div class="bd" id="bd" style="margin-top:8px">${board()}</div><div class="lg"><span><i style="background:var(--g)"></i>Sudah dikerjakan</span><span><i style="background:var(--y)"></i>Ragu-ragu</span><span><i style="background:var(--r)"></i>Belum dikerjakan</span></div><p style="text-align:right;margin:10px 0 0"><button onclick="finish()">Selesai Ujian</button></p></div>`;A.innerHTML=h;scrollTo(0,0)}
function pick(e){const k=S.ord[S.i],it=items[k],j=+e.dataset.j;
 if(it.t=='p')S.ans[k]=j;else if(it.t=='c'){const a=S.ans[k]||[];S.ans[k]=e.checked?[...new Set([...a,j])]:a.filter(x=>x!=j)}

function rg(e){const k=S.ord[S.i];S.ragu[k]=e.checked?1:0;$('#bd').innerHTML=board();sv()}
function go(i){if(i<0||i>=items.length)return;S.i=i;exam()}
async function finish(auto){const kosong=S.ord.filter(k=>!isA(k)).length,rg=S.ord.filter(k=>S.ragu[k]).length;
 if(!auto&&!confirm(`Yakin selesai? Belum dikerjakan: ${kosong} soal, ragu-ragu: ${rg} soal.`))return;
 clearInterval(tick);clearTimeout(S.dt);S.done=true;const pts=items.reduce((s,it,k)=>s+sc(it,S.ans[k]),0);
 S.res={poin:pts,nilai:Math.round(pts/items.length*1000)/10,selesai:Date.now()};S.lock=false;await save();if(unsub)unsub();result()}
function kunci(it){return it.t=='b'?it.o.map((o,j)=>`${j+1}. ${esc(o)} → <b>${it.a.includes(j)?'Benar':'Salah'}</b>`).join('<br>'):it.a.map(j=>esc(it.o[j])).join('; ')}
function jaw(it,v){if(v==null)return '<i>tidak dijawab</i>';return it.t=='p'?esc(it.o[v]):it.t=='c'?(v.length?v.map(j=>esc(it.o[j])).join('; '):'<i>tidak dijawab</i>'):it.o.map((o,j)=>`${j+1}. ${v[j]==null?'–':v[j]?'Benar':'Salah'}`).join(' | ')}
function result(){const r=S.res;let h=`<div class="card c"><div class="m">${esc(S.nama)}</div><h2>Ujian Selesai</h2><div class="big">${r.nilai}</div><p>Poin diperoleh: <b>${r.poin}</b> dari ${items.length}</p><span class="st d">Selesai</span></div><h2>Pembahasan</h2>`;
 items.forEach((it,k)=>{const p=sc(it,S.ans[k]);h+=`<div class="card"><div class="tag">Soal ${k+1} • ${LV[it.l]} • ${TY[it.t]} • <b class="${p==1?'ok':'no'}">Poin ${p}</b></div><b>${esc(it.q)}</b><p>Jawabanmu: ${jaw(it,S.ans[k])}</p><p>Kunci: ${kunci(it)}</p><p class="m">Pembahasan: ${esc(it.e)}</p></div>`});A.innerHTML=h;scrollTo(0,0)}

/* ===== Dashboard guru ===== */
const PW=['1a015011717b487e7138422a837a3ff0bf48b93d46952c705ff947af5763e78b','55c3c7d2bf2672c6c59911d90e4c1133ec58c65e0df5dffde39e273b390b6599'];
function guru(){if(T)return dash();A.innerHTML=`<div class="card c" style="max-width:420px;margin:auto"><h2>Masuk Guru</h2><p class="m">Masukkan kata sandi guru.</p><input type="password" id="pw" style="width:100%;font:inherit;padding:9px 14px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t)" onkeydown="if(event.key=='Enter')cekPw()"><p id="pe" class="no m"></p><div class="nav"><button onclick="login()">Kembali</button><button class="pri" onclick="cekPw()">Masuk</button></div></div>`}
async function cekPw(){const v=$('#pw').value.toLowerCase().replace(/[^a-z]/g,'');let h='';try{h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}
 if(PW.includes(h)){T=true;dash()}else $('#pe').textContent='Kata sandi salah.'}
function dash(){if(!T)return;tab=tab||'proses';if(unsub)unsub();if(db)unsub=db.collection('hasil').onSnapshot(s=>{rows=s.docs.map(d=>d.data()).map(d=>({...d}));rows.forEach((r,i)=>r.id=s.docs[i].id);dv()},()=>dv());dv();clearInterval(tick);tick=setInterval(()=>tab=='proses'&&dv(),5000)}
function dv(){const tb=(k,t)=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';dv()">${t}</button>`;let h=`<div class="card top"><h2 style="margin:0">Dashboard Guru</h2><button onclick="clearInterval(tick);if(unsub)unsub();login()">Keluar</button></div><div class="tabs">${tb('proses','Proses Ujian')}${tb('rekap','Rekap Nilai')}${tb('edit','Edit Soal')}</div>`;
 const R=rows.slice().sort((a,b)=>a.nama.localeCompare(b.nama));
 if(tab=='proses'){h+=`<div class="card sc"><table><tr><th>Nama</th><th>Status</th><th>Terjawab</th><th>Sisa waktu</th><th></th></tr>`+(R.map(r=>{const a=JSON.parse(r.ans||'{}'),n=Object.keys(a).filter(k=>items[k]&&isA(k,a[k])).length,rem=DUR-Math.floor((Date.now()-r.mulai)/1000);
  return `<tr><td>${esc(r.nama)}</td><td>${r.status=='selesai'?'<span class="st d">Selesai</span>':rem>0?'<span class="st">Mengerjakan</span>':'Waktu habis'}</td><td>${n}/${items.length}</td><td>${r.status=='selesai'?'–':fmt(rem)}</td><td><button class="dng" onclick="rst('${r.id}')">Reset</button></td></tr>`}).join('')||'<tr><td colspan="5" class="m">Belum ada peserta.</td></tr>')+`</table><p class="m">Reset menghapus data peserta sehingga bisa mengerjakan ulang.</p></div>`}
 if(tab=='rekap'){const F=R.filter(r=>r.status=='selesai'),ns=F.map(r=>r.nilai);h+=`<div class="card sc"><p>Selesai: <b>${F.length}</b> • Rata-rata: <b>${ns.length?(ns.reduce((a,b)=>a+b,0)/ns.length).toFixed(1):'-'}</b> • Tertinggi: <b>${ns.length?Math.max(...ns):'-'}</b> • Terendah: <b>${ns.length?Math.min(...ns):'-'}</b> <button onclick="csv()">Unduh CSV</button></p><table><tr><th>No</th><th>Nama</th><th>Poin</th><th>Nilai</th></tr>`+(F.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nama)}</td><td>${r.poin}</td><td><b>${r.nilai}</b></td></tr>`).join('')||'<tr><td colspan="4" class="m">Belum ada nilai.</td></tr>')+'</table></div>'}
 if(tab=='edit'){h+=`<div class="card m">Satu opsi per baris. Kunci jawaban: nomor opsi (mulai 1), pisahkan koma. Untuk benar/salah, isi nomor pernyataan yang BENAR. Perubahan berlaku bagi peserta yang masuk sesudah disimpan.</div>`+items.map((it,k)=>`<div class="card"><b>Soal ${k+1}</b> <span class="m">${TY[it.t]}</span><select id="l${k}">${Object.entries(LV).map(([a,b])=>`<option value="${a}" ${it.l==a?'selected':''}>${b}</option>`).join('')}</select><textarea id="q${k}">${esc(it.q)}</textarea><textarea id="o${k}" rows="4">${esc(it.o.join('\n'))}</textarea><input type="text" id="a${k}" value="${it.a.map(x=>x+1).join(',')}"><textarea id="e${k}">${esc(it.e)}</textarea></div>`).join('')+`<div class="nav"><button onclick="rs()">Pulihkan Soal Awal</button><button class="pri" onclick="svq()">Simpan Soal</button></div>`}
 A.innerHTML=h}
async function rst(id){if(confirm('Reset data peserta ini?')){try{await db.doc('hasil/'+id).delete()}catch(e){alert('Gagal reset')}}}
async function csv(){const d=await window.claude.use('downloads');const t='Nama,Poin,Nilai\n'+rows.filter(r=>r.status=='selesai').map(r=>`"${r.nama.replace(/"/g,'')}",${r.poin},${r.nilai}`).join('\n');try{await d.save({filename:'rekap-nilai-pancasila-kelas6.csv',data:t})}catch(e){}}
async function svq(){const n=items.map((it,k)=>({...it,l:$('#l'+k).value,q:$('#q'+k).value.trim(),o:$('#o'+k).value.split('\n').map(s=>s.trim()).filter(Boolean),a:$('#a'+k).value.split(',').map(x=>+x.trim()-1).filter(x=>x>=0),e:$('#e'+k).value.trim()}));
 const bad=n.findIndex(x=>!x.q||x.o.length<2||!x.a.length||x.a.some(j=>j>=x.o.length)||(x.t=='p'&&x.a.length!=1));if(bad>=0)return alert('Periksa soal nomor '+(bad+1));
 try{await db.doc('config/soal').set({items:JSON.stringify(n)});items=n;alert('Soal tersimpan.')}catch(e){alert('Gagal menyimpan.')}}
async function rs(){if(confirm('Kembalikan semua soal ke versi awal?')){try{await db.doc('config/soal').delete()}catch(e){}items=Q;dv()}}
</script></body></html>
